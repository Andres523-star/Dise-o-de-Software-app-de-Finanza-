spring.application.name=misfinanzas-api
# En el computador usa 8080. En AWS Elastic Beanstalk se define la variable PORT=5000.
# 📌 PRESENTACION 19 ¿DÓNDE ESTÁ DESPLEGADA? AWS Elastic Beanstalk (puerto 5000)
server.port=${PORT:8080}

# Por defecto se usa MongoDB embebido (no hay que instalar nada).
# Para usar un MongoDB real: ejecutar con el perfil "mongo" (ver README).
spring.profiles.default=embebido

# Mensajes de error sin trazas internas
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# API externa de divisas (TRM) usada por TrmApiAdapter
misfinanzas.divisas.url=https://open.er-api.com/v6/latest/
