# Perfil "mongo": usa un MongoDB real (local o Atlas).
# Local:  mongodb://localhost:27017/misfinanzas  (valor por defecto)
# Atlas:  export MONGODB_URI="mongodb+srv://usuario:clave@cluster.mongodb.net/misfinanzas"
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/misfinanzas}
spring.autoconfigure.exclude=de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration
