# Compila y prueba la API Java en GitHub cada vez que cambia misfinanzas-api/.
# El .jar resultante queda como "artifact" para subirlo a AWS Elastic Beanstalk.
name: API Java (build y pruebas)

on:
  push:
    paths:
      - "misfinanzas-api/**"
      - ".github/workflows/misfinanzas-api.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: misfinanzas-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: maven

      - name: Compilar y correr las pruebas
        run: mvn -B package

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: misfinanzas-api-jar
          path: misfinanzas-api/target/misfinanzas-api-1.0.0.jar
